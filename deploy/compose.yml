services:
  food-tracker:
    image: ghcr.io/branchenprimus/food-tracker-cli:latest
    container_name: food-tracker
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=prod
    ports:
      - "8787:8787"
    volumes:
      # Map the local data directory to /app/data inside the container
      # Assuming the workdir is /app or similar, we map to where the code expects it based on env vars
      # Default env var is "data/app.db" relative to running dir.
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=prod
      - APP_GIT_REF=master
      # Explicitly set paths for clarity (optional as defaults match, but good practice)
      - FOOD_TRACKER_DB=data/app.db
      - FOOD_TRACKER_CACHE=data/widget_cache.json
      - WIDGET_API_TOKEN=${WIDGET_API_TOKEN}

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
    command: --interval 60 --cleanup --label-enable --scope prod
