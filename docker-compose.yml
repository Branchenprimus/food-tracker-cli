services:
  food-tracker:
    image: ghcr.io/branchenprimus/food-tracker-cli:dev
    container_name: food-tracker-dev
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=dev
    ports:
      - "8686:8787"
    volumes:
      - food-data-dev:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=dev
      - APP_GIT_REF=dev
      - FOOD_TRACKER_DB=data/app.db
      - FOOD_TRACKER_CACHE=data/widget_cache.json

  watchtower-dev:
    image: containrrr/watchtower
    container_name: watchtower-dev
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
    command: --interval 15 --cleanup --label-enable --scope dev food-tracker-dev

volumes:
  food-data-dev:
