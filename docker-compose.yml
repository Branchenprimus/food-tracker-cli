services:
  food-tracker:
    build:
      context: .
      args:
        APP_VERSION: dev-local
        APP_COMMIT: local
        APP_ENV: dev
        APP_GIT_REF: dev
    image: food-tracker-dev:local
    container_name: food-tracker-dev
    restart: unless-stopped
    ports:
      - "8686:8787"
    volumes:
      - food-data-dev:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=dev
      - APP_GIT_REF=dev
      - FOOD_TRACKER_DB=data/app.db
      - FOOD_TRACKER_CACHE=data/widget_cache.json

volumes:
  food-data-dev:
