[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-tracker-cli"
version = "0.2.0"
description = "API-key based CLI client for Food Tracker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Food Tracker" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Branchenprimus/food-tracker-cli"

[project.scripts]
food-tracker-cli = "foodtracker_client.cli:main"

[tool.setuptools]
packages = ["foodtracker_client"]
